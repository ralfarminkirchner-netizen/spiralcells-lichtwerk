<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3eee3">
<title>Ralfs Werke</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23241f19'/%3E%3Cpath d='M16 26V14M16 14l-6-5M16 14l6-5M16 11V5' stroke='%23f3eee3' stroke-width='2.4' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="werkansichten/stil.css">
</head>
<body data-ansicht="baum">
<a class="sprung" href="#buehne">Zur Ansicht springen</a>
<nav id="leiste" aria-label="Ansicht wechseln"></nav>
<header id="kopf">
  <button id="marke" type="button">Ralfs Werke</button>
  <nav id="weg" aria-label="Wo bin ich"></nav>
  <div id="suchstand" hidden></div>
  <button id="suchknopf" type="button" aria-label="Suchen"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/></svg><span>Suchen</span><kbd>/</kbd></button>
</header>
<div id="unterkopf"><p id="frage"></p><div id="legende"></div></div>
<main id="buehne" tabindex="-1" aria-label="Die Ansicht"></main>
<aside id="blatt" aria-labelledby="blatttitel" hidden></aside>
<div id="suche" role="dialog" aria-modal="true" aria-label="Suchen" hidden>
  <div class="suchfeld">
    <input type="search" placeholder="Suchen im ganzen Bestand" aria-label="Suchbegriff" autocomplete="off" spellcheck="false">
    <p class="zahl klein"></p>
    <ul role="listbox" aria-label="Treffer"></ul>
    <button type="button" class="alle knopf">Alle Treffer in der Ansicht hervorheben</button>
  </div>
</div>
<p id="hinweis" role="status" aria-live="polite"></p>
<script type="module" src="werkansichten/haupt.js"></script>
</body>
</html>
