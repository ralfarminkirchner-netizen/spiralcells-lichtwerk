<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lichtgrund Welten</title>
<style>
html,body{margin:0;height:100%;background:#0d0b0a;overflow:hidden;color:#f1e8d8;font:300 15px/1.45 "Avenir Next","Futura",system-ui,sans-serif}
#welt{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#namen{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#namen span{position:absolute;left:0;top:0;white-space:nowrap;letter-spacing:.18em;font-size:13px;text-shadow:0 1px 8px #000,0 0 2px #000;will-change:transform}
#namen span.werk{font-size:11px;letter-spacing:.06em;opacity:0;display:flex;align-items:center;gap:4px;background:rgba(14,10,6,.6);padding:2px 7px 2px 4px;border-radius:9px}
#namen span.werk img{width:13px;height:13px;filter:invert(1)}
#satz{position:fixed;left:16px;right:16px;bottom:calc(28px + env(safe-area-inset-bottom,0px));text-align:center;letter-spacing:.06em;font-size:clamp(15px,1vw + 9px,19px);text-shadow:0 1px 10px #000,0 0 3px #000;pointer-events:none;text-wrap:balance}
#satz small{display:block;opacity:.75;font-size:.8em;margin-top:2px}
#wahl{position:fixed;left:50%;translate:-50% 0;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:2px;background:rgba(10,8,6,.5);backdrop-filter:blur(14px);border:1px solid rgba(255,246,224,.14);border-radius:12px;padding:4px;max-width:calc(100vw - 16px);overflow-x:auto}
#wahl button{all:unset;cursor:pointer;min-height:40px;min-width:44px;display:flex;align-items:center;justify-content:center;padding:0 12px;font-size:14px;letter-spacing:.04em;border-radius:8px;white-space:nowrap;box-sizing:border-box}
#wahl button:hover,#wahl button:focus-visible{background:rgba(255,246,224,.12)}
#wahl button[aria-pressed=true]{background:rgba(255,246,224,.9);color:#16110c}
@media(max-width:480px){#wahl button{padding:0 8px;font-size:13px}}
#spiralknopf{all:unset;position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));cursor:pointer;min-height:44px;display:flex;align-items:center;padding:0 16px;border-radius:10px;font-size:14px;background:rgba(10,8,6,.55);backdrop-filter:blur(14px);border:1px solid rgba(255,246,224,.18)}
#spiralknopf[hidden]{display:none}
#spiralknopf[aria-pressed=true]{background:rgba(255,246,224,.9);color:#16110c}
#bildknopf{all:unset;position:fixed;right:16px;bottom:calc(138px + env(safe-area-inset-bottom,0px));cursor:pointer;min-height:44px;display:flex;align-items:center;padding:0 16px;border-radius:10px;font-size:14px;background:rgba(10,8,6,.55);backdrop-filter:blur(14px);border:1px solid rgba(255,246,224,.18)}
#bildknopf[hidden]{display:none}
#bildknopf[aria-pressed=true]{background:rgba(255,246,224,.9);color:#16110c}
#stockwerke{position:fixed;left:50%;translate:-50% 0;top:calc(12px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:2px;background:rgba(10,8,6,.6);backdrop-filter:blur(14px);border:1px solid rgba(255,246,224,.14);border-radius:12px;padding:4px}
#stockwerke[hidden],#lesen[hidden]{display:none}
#stockwerke button{all:unset;cursor:pointer;min-height:40px;min-width:44px;display:flex;align-items:center;justify-content:center;padding:0 12px;border-radius:8px;font-size:14px}
#stockwerke button:hover,#stockwerke button:focus-visible{background:rgba(255,246,224,.12)}
#stockwerke .wo{padding:0 8px;font-size:14px;font-variant-numeric:tabular-nums}
#lesen{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);box-sizing:border-box;overflow-y:auto;padding:64px 32px 48px;background:rgba(12,10,8,.93);backdrop-filter:blur(18px);border-left:1px solid rgba(255,246,224,.12);font:400 17px/1.6 Georgia,"Iowan Old Style",serif}
#lesen h2{font:400 26px/1.25 "Avenir Next",system-ui,sans-serif;margin:4px 0 24px}#lesen .werk{margin:0;font:300 13px "Avenir Next",system-ui,sans-serif;opacity:.7}#lesen .leise{opacity:.65;font-size:14px}
#lesen .zu{all:unset;cursor:pointer;position:absolute;top:14px;right:14px;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<canvas id="welt"></canvas>
<div id="namen"></div>
<nav id="stockwerke" hidden><button type="button" class="raus">← hinaus</button><button type="button" class="ab" aria-label="Ein Stockwerk tiefer">▼</button><span class="wo"></span><button type="button" class="auf" aria-label="Ein Stockwerk höher">▲</button></nav>
<article id="lesen" hidden><button type="button" class="zu" aria-label="Schließen">✕</button><p class="werk"></p><h2></h2><div class="text"></div></article>
<p id="satz">Das Dorf entsteht.</p>
<script type="module" src="neu/welten.bundle.js"></script>
</body>
</html>
