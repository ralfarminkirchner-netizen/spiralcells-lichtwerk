<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lichtgrund · Galaxie</title>
<style>
:root{ --tinte:#f3ecdf; --leise:#a9a294; --gold:#f2c98a; --grund:#010104; --glas:rgba(10,10,18,.62); --rand:rgba(243,236,223,.16);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif; --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; background:var(--grund); color:var(--tinte); font-family:var(--sans); overflow:hidden; overscroll-behavior:none; }
#buehne{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; opacity:0; transition:opacity 1.2s ease; }
.bereit #buehne{ opacity:1; }
button,input{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }

#kopf{ position:fixed; left:0; right:0; top:0; display:flex; align-items:flex-start; gap:20px; padding:calc(18px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) 0 calc(24px + env(safe-area-inset-left)); pointer-events:none; }
#kopf > *{ pointer-events:auto; }
#marke{ margin:0; font-family:var(--serif); font-weight:400; line-height:1; }
#marke small{ display:block; font-family:var(--sans); font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--leise); margin-bottom:8px; }
#marke b{ font-weight:400; font-size:34px; letter-spacing:.01em; }
#suchfeld{ margin-left:auto; position:relative; width:min(340px, 46vw); }
#suche{ width:100%; height:42px; padding:0 14px; border:1px solid var(--rand); border-radius:21px; background:var(--glas); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); }
#suche::placeholder{ color:var(--leise); }
#treffer{ list-style:none; margin:8px 0 0; padding:6px; border:1px solid var(--rand); border-radius:14px; background:var(--glas); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); max-height:50vh; overflow:auto; }
#treffer button{ display:flex; justify-content:space-between; gap:12px; width:100%; min-height:44px; padding:8px 10px; border:0; border-radius:9px; background:none; text-align:left; cursor:pointer; }
#treffer button:hover,#treffer button:focus-visible{ background:rgba(243,236,223,.1); }
#treffer span,#treffer .leer{ color:var(--leise); font-size:13px; }
#treffer .leer{ padding:10px; line-height:1.45; }

#schilder{ position:fixed; inset:0; pointer-events:none; overflow:hidden; }
.schild{ position:absolute; left:0; top:0; margin:0; padding:4px 10px 5px; border:0; border-left:1px solid rgba(242,201,138,.75); background:none; text-align:left; cursor:pointer; pointer-events:auto; white-space:nowrap; will-change:transform; text-shadow:0 0 6px #000, 0 1px 14px #000, 0 0 2px #000; }
.schild.links{ border-left:0; border-right:1px solid rgba(242,201,138,.75); text-align:right; }
.schild .art{ display:block; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--leise); }
.schild .nm{ font-family:var(--serif); font-size:19px; }
.schild.kern .nm{ font-size:23px; color:var(--gold); }
.schild.an{ border-left-color:#fff; } .schild.an .nm{ color:#fff; }

#tafel{ position:fixed; right:calc(24px + env(safe-area-inset-right)); bottom:calc(64px + env(safe-area-inset-bottom)); width:min(380px, calc(100vw - 48px)); padding:20px 22px 22px; border:1px solid var(--rand); border-radius:18px; background:var(--glas); -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); }
#tafel-art{ margin:0 0 6px; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); }
#tafel-name{ margin:0 0 10px; font-family:var(--serif); font-weight:400; font-size:30px; line-height:1.1; }
#tafel-text{ margin:0; color:#d2cabb; font-size:15px; line-height:1.5; }
#tafel-zu{ position:absolute; right:8px; top:8px; width:44px; height:44px; border:0; background:none; font-size:22px; color:var(--leise); cursor:pointer; border-radius:22px; }

#fuss{ position:fixed; left:0; right:0; bottom:0; display:flex; align-items:center; gap:10px; padding:0 calc(24px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left)); pointer-events:none; }
#fuss > *{ pointer-events:auto; }
.taste{ min-height:44px; padding:0 16px; border:1px solid var(--rand); border-radius:22px; background:var(--glas); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); cursor:pointer; }
.taste:hover{ border-color:rgba(243,236,223,.4); }
#stand{ margin:0 0 0 auto; max-width:46ch; color:var(--leise); font-size:12.5px; line-height:1.4; text-align:right; text-shadow:0 1px 6px #000; pointer-events:none; }
#diagnose{ position:fixed; left:calc(24px + env(safe-area-inset-left)); top:96px; font:12px ui-monospace,Menlo,monospace; color:var(--leise); }
[hidden]{ display:none !important; }

/* iPad quer: gleiche Ordnung, größere Ziele */
@media (pointer:coarse) and (min-width:700px){ .schild{ padding:9px 12px 10px; } .schild .nm{ font-size:21px; } #suche{ height:46px; } }
/* Handy hoch: Marke und Suche gestapelt, Tafel als Blatt von unten, Stand über den Tasten */
@media (max-width:600px){
  #kopf{ flex-direction:column; gap:12px; padding-left:16px; padding-right:16px; }
  #marke b{ font-size:26px; } #suchfeld{ margin:0; width:100%; }
  .schild .nm{ font-size:15px; } .schild.kern .nm{ font-size:18px; } .schild .art{ display:none; } .schild{ padding:13px 8px; border-image:linear-gradient(180deg, transparent 30%, rgba(242,201,138,.8) 30%, rgba(242,201,138,.8) 70%, transparent 70%) 1; }
  #tafel{ left:0; right:0; bottom:0; width:auto; border-radius:20px 20px 0 0; border-width:1px 0 0; padding-bottom:calc(84px + env(safe-area-inset-bottom)); }
  #tafel-name{ font-size:25px; }
  #fuss{ flex-wrap:wrap; padding-left:16px; padding-right:16px; } #stand{ order:-1; flex-basis:100%; text-align:left; margin:0; }
  body:has(#tafel:not([hidden])) #stand{ display:none; }
  #diagnose{ top:150px; left:16px; }
}
@media (prefers-reduced-motion:reduce){ #buehne{ transition:none; } }
</style>
</head>
<body>
<canvas id="buehne" aria-label="Spiralgalaxie: im Kern die Zentrale, auf den Armen die sieben Oberdächer als Sonnen"></canvas>
<div id="schilder"></div>
<header id="kopf">
  <h1 id="marke"><small>Lichtgrund · Welten</small><b>Galaxie</b></h1>
  <div id="suchfeld" role="search">
    <input id="suche" type="search" placeholder="Suchen" aria-label="Suche über alles" autocomplete="off" spellcheck="false">
    <ul id="treffer" hidden></ul>
  </div>
</header>
<aside id="tafel" hidden aria-live="polite">
  <button id="tafel-zu" type="button" aria-label="Schließen und zum Gesamtbild">×</button>
  <p id="tafel-art"></p><h2 id="tafel-name"></h2><p id="tafel-text"></p>
</aside>
<footer id="fuss">
  <button id="fahrt-aus" class="taste" type="button" hidden>Fahrt überspringen</button>
  <button id="zurueck" class="taste" type="button" hidden>Gesamtbild</button>
  <button id="fahrt-neu" class="taste" type="button">Fahrt</button>
  <p id="stand">Die Galaxie entsteht …</p>
</footer>
<pre id="diagnose" hidden></pre>
<script type="module" src="welten3d/welten3d.bundle.js"></script>
</body>
</html>
